    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
    robot_base_frame: base_link
    use_sim_time: true
    wait_for_service_timeout: 1000
controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle.scale: 0.4
      GoalDist.scale: 32.0
      ObstacleFootprint.scale: 0.04
      PathDist.scale: 32.0
      acc_lim_theta: 0.0
      acc_lim_x: 1.75
      acc_lim_y: 1.75
      angular_granularity: 0.025
      critics:
      - rmul_c072_planner::PredictedObstacle
      - BaseObstacle
      - ObstacleFootprint
      - PathDist
      - GoalDist
      - rmul_c072_planner::TerminalGoal
      - rmul_c072_planner::PathProgress
      - rmul_c072_planner::SweptClearance
      debug_trajectory_details: true
      decel_lim_theta: 0.0
      decel_lim_x: -1.75
      decel_lim_y: -1.75
      discretize_by_time: true
      forward_prune_distance: 4.0
      include_last_point: true
      limit_vel_cmd_in_traj: false
      linear_granularity: 0.025
      max_accel_xy: 1.75
      max_speed_xy: 2.0
      max_vel_theta: 0.0
      max_vel_x: 2.0
      max_vel_y: 2.0
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: -2.0
      min_vel_y: -2.0
      planning_cell_coverage: true
      planning_clearance_radius: 0.5
      plugin: rmul_c072_planner::InflationAwareController
      pose_projection_horizon: 0.1
      prune_distance: 1.0
      prune_plan: true
      publish_cost_grid_pc: false
      publish_evaluation: false
      publish_global_plan: true
      publish_local_plan: true
      publish_trajectories: false
      publish_transformed_plan: true
      rmul_c072_planner::PathProgress.scale: 40.0
      rmul_c072_planner::PredictedObstacle.scale: 120.0
      rmul_c072_planner::SweptClearance.braking_direction_weight: 0.6
      rmul_c072_planner::SweptClearance.scale: 160.0
      rmul_c072_planner::TerminalGoal.scale: 64.0
      short_circuit_trajectory_evaluation: true
      shorten_transformed_plan: true
      sim_time: 1.5
      time_granularity: 0.05
      trajectory_generator_name: rmul_c072_planner::FineLowSpeedTrajectoryGenerator
      transform_tolerance: 0.1
      vtheta_samples: 1
      vx_samples: 51
      vy_samples: 51
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 6.28
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /cart/odom
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[[0.434978334, 0.0], [0.426620347, 0.084860063], [0.401867579, 0.166459002],
        [0.361671266, 0.241661014], [0.307576129, 0.307576129], [0.241661014, 0.361671266],
        [0.166459002, 0.401867579], [0.084860063, 0.426620347], [0.0, 0.434978334],
        [-0.084860063, 0.426620347], [-0.166459002, 0.401867579], [-0.241661014, 0.361671266],
        [-0.307576129, 0.307576129], [-0.361671266, 0.241661014], [-0.401867579, 0.166459002],
        [-0.426620347, 0.084860063], [-0.434978334, 0.0], [-0.426620347, -0.084860063],
        [-0.401867579, -0.166459002], [-0.361671266, -0.241661014], [-0.307576129,
        -0.307576129], [-0.241661014, -0.361671266], [-0.166459002, -0.401867579],
        [-0.084860063, -0.426620347], [-0.0, -0.434978334], [0.084860063, -0.426620347],
        [0.166459002, -0.401867579], [0.241661014, -0.361671266], [0.307576129, -0.307576129],
        [0.361671266, -0.241661014], [0.401867579, -0.166459002], [0.426620347, -0.084860063]]'
      footprint_padding: 0.02
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 2.6
        inflation_radius: 0.9
        plugin: nav2_costmap_2d::InflationLayer
      intensity_voxel_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        mark_threshold: 0
        max_obstacle_height: 2.0
        max_obstacle_intensity: 2.0
        min_obstacle_height: 0.0
        min_obstacle_intensity: 0.1
        observation_sources: terrain_map_ext
        origin_z: 0.0
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        publish_voxel_map: false
        terrain_map_ext:
          data_type: PointCloud2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          observation_persistence: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          sensor_frame: front_mid360_scan
          topic: /terrain_map_ext
        track_unknown_space: true
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
      mid_geometric_obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: false
        mark_threshold: 0
        max_obstacle_height: 2.0
        max_obstacle_intensity: 1.5
        mid_geometric_cloud:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.06
          observation_persistence: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          sensor_frame: front_mid360_scan
          topic: /mid/geometric_obstacles
        min_obstacle_height: 0.0
        min_obstacle_intensity: 0.5
        observation_sources: mid_geometric_cloud
        origin_z: 0.0
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        publish_voxel_map: false
        track_unknown_space: true
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
      odin_obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: false
        mark_threshold: 0
        max_obstacle_height: 2.0
        max_obstacle_intensity: 1.5
        min_obstacle_height: 0.0
        min_obstacle_intensity: 0.5
        observation_sources: odin_cloud
        odin_cloud:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.06
          observation_persistence: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          sensor_frame: odin_scan
          topic: /odin/obstacles
        origin_z: 0.0
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        publish_voxel_map: false
        track_unknown_space: true
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
      plugins:
      - static_layer
      - intensity_voxel_layer
      - odin_obstacle_layer
      - mid_geometric_obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 5.0
      use_sim_time: true
